<div class="container">
  <h2>Crear Customer</h2>

  <form (ngSubmit)="addCustomer()">
    <div class="mb-3">
      <label for="firstName" class="form-label">Nombres</label>
      <input [(ngModel)]="firstName" type="text" class="form-control" id="firstName" name="firstName" required>
    </div>

    <div class="mb-3">
      <label for="lastName" class="form-label">Apellidos</label>
      <input [(ngModel)]="lastName" type="text" class="form-control" id="lastName" name="lastName" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input [(ngModel)]="email" type="email" class="form-control" id="email" name="email" required>
    </div>

    <button type="submit" class="btn btn-primary">Crear</button>
  </form>
</div>
